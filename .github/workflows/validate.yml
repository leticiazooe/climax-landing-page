name: Validate CLIMAX static deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Match Cloudflare npm
        run: npm install --global npm@10.9.2

      - name: Clean install
        run: npm clean-install --progress=false

      - name: Build static site
        run: npm run build

      - name: Enforce performance budget
        run: npm run check

      - name: Verify static deploy bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
